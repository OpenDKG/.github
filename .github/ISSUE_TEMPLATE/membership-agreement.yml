name: "OpenDKG membership and agreement"
description: "Request OpenDKG organization membership after reviewing and accepting the versioned policies."
title: "[Membership request] "
body:
  - type: markdown
    attributes:
      value: |
        ## OpenDKG membership request — version 1.0
        **Only applications filed in [OpenDKG/.github](https://github.com/OpenDKG/.github/issues/new?template=membership-agreement.yml) are processed.** This template can also be visible as an organization default in other repositories; do not file there.

        **Read these pinned documents before checking any boxes:**
        - [Contributor Agreement v1.0](https://github.com/OpenDKG/.github/blob/12b4e5bfb23285f66127cfb979ed1327eaab8e64/CONTRIBUTOR_AGREEMENT.md)
        - [Governance v1.0](https://github.com/OpenDKG/.github/blob/12b4e5bfb23285f66127cfb979ed1327eaab8e64/GOVERNANCE.md)
        - [Contribution guidelines v1.0](https://github.com/OpenDKG/.github/blob/12b4e5bfb23285f66127cfb979ed1327eaab8e64/CONTRIBUTING.md)
        - [Developer Certificate of Origin](https://github.com/OpenDKG/.github/blob/12b4e5bfb23285f66127cfb979ed1327eaab8e64/DCO.md)

        **Exact agreement revision:** `12b4e5bfb23285f66127cfb979ed1327eaab8e64`. The forms refer to this specific version, not to future changes. NetPetra is excluded from all coverage.

        These terms are a **proposal until the three initial founders expressly adopt them**. Do not use this form to grant membership until adoption is confirmed. Filing this public issue is not an automatic invitation, a qualified electronic signature, or proof of civil identity.

        This issue and your GitHub username are public. **Do not provide legal names, addresses, identity documents, personal email, passwords, secrets, or sensitive personal information.**
  - type: input
    id: github-handle
    attributes:
      label: "Your GitHub username"
      description: "Must match the account publishing this request. This is your public pseudonym, not a request for your legal name."
      placeholder: "your-github-username"
    validations:
      required: true
  - type: dropdown
    id: requested-role
    attributes:
      label: "Requested participation"
      options:
        - "Developer / member"
        - "Reviewer / maintainer candidate"
        - "Documentation / community contributor"
    validations:
      required: true
  - type: checkboxes
    id: contributor-agreement-v1
    attributes:
      label: "Contributor Agreement v1.0 — explicit acceptance"
      options:
        - label: "I have read and affirmatively accept OpenDKG Contributor Agreement v1.0 at commit 12b4e5bfb23285f66127cfb979ed1327eaab8e64 for my authorized contributions to present and future Covered Repositories. NetPetra is excluded. I understand that existing valid outbound open-source licenses remain effective if I leave."
          required: true
  - type: checkboxes
    id: governance-v1
    attributes:
      label: "Governance v1.0 — explicit acceptance"
      options:
        - label: "I have read and accept OpenDKG Governance v1.0 at commit 12b4e5bfb23285f66127cfb979ed1327eaab8e64 for my requested role, including contribution review, decision-making, access control, and departure."
          required: true
  - type: checkboxes
    id: contributing-dco-v1
    attributes:
      label: "Contribution rules and DCO"
      options:
        - label: "I agree to follow the contribution guidelines and to certify the right to submit each commit using the DCO sign-off process when contributing. I understand the DCO is not a substitute for the Contributor Agreement."
          required: true
  - type: checkboxes
    id: authority
    attributes:
      label: "Authority and public record"
      options:
        - label: "To the best of my knowledge, I have or will obtain the rights needed for my contributions, including required employer, client or coauthor permission."
          required: true
        - label: "I understand this public GitHub issue is an attributable record under my GitHub username and that the organization will record the version, date, and acceptance link. No private identity verification is implied."
          required: true
  - type: textarea
    id: notes
    attributes:
      label: "Optional project interests"
      description: "Describe only publicly shareable interests. Do not paste private information."
      placeholder: "Interested in contributing to..."
    validations:
      required: false
